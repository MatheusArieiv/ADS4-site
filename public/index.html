
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Cardápio Dinâmico</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>🍔 Lanchonete Full-Stack</h1>

            <p>
                Este cardápio está sendo gerado dinamicamente pela nossa API Node.js!
            </p>

            <!-- Botões para interagir com o Back-end -->
            <div class="filtros">
                <button onclick="carregarCardapio('/api/cardapio')">
                    Todos os Itens
                </button>

                <button
                    onclick="carregarCardapio('/api/cardapio/bebidas')"
                    class="btn-desafio"
                >
                    Apenas Bebidas (Desafio)
                </button>
            </div>
        </header>


        <!-- Formulário de cadastro -->
        <div class="cadastro-form">

            <h3>Cadastrar Novo Item</h3>

            <input
                type="text"
                id="novoNome"
                placeholder="Nome do Produto"
            >

            <select id="novaCategoria">
                <option value="Lanche">Lanche</option>
                <option value="Bebida">Bebida</option>
                <option value="Acompanhamento">Acompanhamento</option>
            </select>
