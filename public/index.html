<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Cardápio Dinâmico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🍔 Lanchonete Full-Stack</h1>
            <p>Este cardápio está sendo gerado dinamicamente pela nossa API Node.js!</p>
            
            <!-- Botões para interagir com o Back-end -->
            <div class="filtros">
                <button onclick="carregarCardapio('/api/cardapio')">Todos os Itens</button>
                <button onclick="carregarCardapio('/api/cardapio/bebidas')" class="btn-desafio">Apenas Bebidas (Desafio)</button>
            </div>
        </header>

        <!-- Aqui é onde os lanches vão aparecer -->
        <main id="vitrine-cardapio">
            <p class="loading">Carregando dados do servidor...</p>
        </main>
    </div>

    <script>
        // Função para buscar e renderizar os dados do Node.js
        function carregarCardapio(url) {
            const vitrine = document.getElementById('vitrine-cardapio');
            vitrine.innerHTML = '<p class="loading">Buscando dados no servidor...</p>';

            // O fetch faz o pedido ao nosso Garçom (API)
            fetch(url)
                .then(resposta => {
                    // Se a rota der erro (Ex: 404), tratamos aqui
                    if (!resposta.ok) {
                        throw new Error('Rota não encontrada. Você já resolveu o desafio final no server.js?');
                    }
                    return resposta.json(); // Transforma a resposta em formato utilizável
                })
                .then(dados => {
                    // Limpa a tela
                    vitrine.innerHTML = '';

                    // Se a lista vier vazia
                    if (dados.length === 0) {
                        vitrine.innerHTML = '<p>Nenhum item encontrado.</p>';
                        return;
                    }

                    // Percorre os dados e cria os elementos HTML dinamicamente
                    dados.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'card';
                        
                        // Formata o número para exibir como Moeda (R$)
                        const precoFormatado = item.preco.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

                        // Monta o visual do produto
                        card.innerHTML = `
                            <div class="categoria">${item.categoria}</div>
                            <h2>${item.nome}</h2>
                            <div class="preco">${precoFormatado}</div>
                        `;
                        
                        // Adiciona o produto na tela
                        vitrine.appendChild(card);
                    });
                })
                .catch(erro => {
                    // Exibe a mensagem de erro na tela de forma amigável
                    vitrine.innerHTML = `<p class="erro">❌ Ops! ${erro.message}</p>`;
                });
        }

        // Carrega o cardápio completo automaticamente assim que a página abre
        window.onload = () => carregarCardapio('/api/cardapio');
    </script>
</body>
</html>
